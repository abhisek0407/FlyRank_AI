services:
  api:
    build: .

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/tasks

    depends_on:
     db:
      condition: service_started

  db:
    image: postgres:17

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks

    ports:
      - "5432:5432"

    volumes:
      - taskdata:/var/lib/postgresql/data

volumes:
  taskdata: